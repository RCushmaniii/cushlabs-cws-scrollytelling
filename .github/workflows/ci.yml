name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded push should stop costing wall-clock and a queue slot. Without
# this, pushing twice to an open PR leaves the first run building a commit
# nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Default is 360 minutes. One hung install would hold a runner for six
    # hours to tell us nothing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # Was 20. Astro 6 refuses to build on it outright — "Node.js v20.20.2
          # is not supported by Astro!" — which failed every run on main from
          # the Astro 6 upgrade until 2026-09-17. 22 is Active LTS and matches
          # the workstation, so a green build here means the same thing it means
          # locally.
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
